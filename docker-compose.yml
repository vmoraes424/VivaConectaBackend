name: viva-conecta

services:
  postgres:
    image: postgres:16-alpine
    container_name: viva-conecta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: viva_conecta
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viva_conecta"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viva-conecta-api
    restart: unless-stopped
    ports:
      - "3334:3334"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3334
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/viva_conecta
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-viva-conecta-change-me-in-production}
      COOKIE_SECRET: ${COOKIE_SECRET:-super-secret-cookie-key-viva-conecta-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Viva Conecta <noreply@noreply.vivasf.com.br>}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-viva-conecta}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
